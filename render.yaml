services:
  - type: web
    name: jarvis-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: FISH_API_KEY
        sync: false
      - key: FISH_VOICE_ID
        value: 05b36da8574341d0803391491850db20
      - key: FISH_MODEL
        value: s2.1-pro-free
      - key: JARVIS_SECRET
        generateValue: true
    plan: free
    region: oregon
